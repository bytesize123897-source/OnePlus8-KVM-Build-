name: Build OnePlus 8 KVM Minimal Kernel

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-kernel.yml'
      - 'configs/**'
      - 'patches/**'
  workflow_dispatch:

concurrency:
  group: oneplus8-kvm-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      OFFICIAL_KERNEL_SHA: 1d2678a3548f4825447f17b25a5cc1754c4cd1ae
      OFFICIAL_MODULES_SHA: 01fb3921e0f57c338c95f9bcbe1a9938821c7e6d
      KERNEL_DIR: kernel/msm-4.19
      MODULES_DIR: official-modules
      STOCK_OUT_DIR: out-stock
      OUT_DIR: out
      ARTIFACT_DIR: artifact
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: 'true'
      CCACHE_MAXSIZE: 5G
      CCACHE_COMPILERCHECK: content

    steps:
      - name: Checkout build controls
        uses: actions/checkout@v4
        with:
          path: control

      - name: Checkout official OnePlus kernel
        uses: actions/checkout@v4
        with:
          repository: OnePlusOSS/android_kernel_oneplus_sm8250
          ref: ${{ env.OFFICIAL_KERNEL_SHA }}
          path: ${{ env.KERNEL_DIR }}
          fetch-depth: 1

      - name: Checkout official OnePlus modules and device tree
        uses: actions/checkout@v4
        with:
          repository: OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm8250
          ref: ${{ env.OFFICIAL_MODULES_SHA }}
          path: ${{ env.MODULES_DIR }}
          fetch-depth: 1

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            ccache rsync python3 git make \
            clang-14 llvm-14 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

          mkdir -p "$CCACHE_DIR"
          ccache --set-config=max_size="$CCACHE_MAXSIZE"
          ccache --set-config=compression=true
          ccache --set-config=compiler_check=content
          ccache --zero-stats

          clang-14 --version | head -n 1
          aarch64-linux-gnu-ld --version | head -n 1
          aarch64-linux-gnu-gcc --version | head -n 1

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: oneplus8-kvm-sm8250-linkfix-${{ hashFiles('control/patches/sm8250-link-compat.patch', 'control/configs/kvm-minimal.config') }}
          restore-keys: |
            oneplus8-kvm-sm8250-linkfix-

      - name: Assemble official OnePlus source tree
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$ARTIFACT_DIR"

          test -d "$MODULES_DIR/kernel/msm-4.19"
          rsync -a "$MODULES_DIR/kernel/msm-4.19/" "$KERNEL_DIR/"

          rm -rf vendor
          ln -s "$GITHUB_WORKSPACE/$MODULES_DIR/vendor" vendor

          test -f "$KERNEL_DIR/arch/arm64/configs/vendor/kona-perf_defconfig"
          test -f "$KERNEL_DIR/OplusKernelEnvConfig.mk"
          test -f "$KERNEL_DIR/oplus_native_features.mk"
          test -f "$GITHUB_WORKSPACE/control/patches/sm8250-link-compat.patch"
          test -d vendor/oplus/kernel/oplus_performance/sched_assist
          test -d vendor/qcom/opensource/audio-kernel
          test -d vendor/qcom/opensource/data-kernel
          test -d vendor/qcom/opensource/wlan

          test "$(git -C "$KERNEL_DIR" rev-parse HEAD)" = "$OFFICIAL_KERNEL_SHA"
          test "$(git -C "$MODULES_DIR" rev-parse HEAD)" = "$OFFICIAL_MODULES_SHA"

          if grep -RniE 'daxiaamu|resukisu|kernelsu' \
              "$KERNEL_DIR/Makefile" \
              "$KERNEL_DIR/arch/arm64/configs/vendor/kona-perf_defconfig"; then
            echo 'Unexpected third-party branding/config found in source baseline.' >&2
            exit 1
          fi

      - name: Apply minimal SM8250 link compatibility fix
        shell: bash
        run: |
          set -euxo pipefail
          PATCH="$GITHUB_WORKSPACE/control/patches/sm8250-link-compat.patch"

          git -C "$KERNEL_DIR" apply --check "$PATCH"
          git -C "$KERNEL_DIR" apply "$PATCH"

          grep -n 'BSS_FIRST_SECTIONS RTIC_BSS' "$KERNEL_DIR/arch/arm64/kernel/vmlinux.lds.S"
          grep -n 'PROVIDE(__crc_gsi_write_channel_scratch = 0);' "$KERNEL_DIR/arch/arm64/kernel/vmlinux.lds.S"

          git -C "$KERNEL_DIR" diff -- arch/arm64/kernel/vmlinux.lds.S \
            | tee "$ARTIFACT_DIR/sm8250-link-compat-applied.diff"

      - name: Build official baseline with link compatibility fix
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$STOCK_OUT_DIR" "$ARTIFACT_DIR"

          export_oplus_features() {
            local key value
            while IFS='=' read -r key value; do
              [[ "$key" =~ ^[A-Z][A-Z0-9_]*$ ]] || continue
              export "$key=$value"
            done < "$KERNEL_DIR/oplus_native_features.mk"
          }
          export_oplus_features

          for feature in \
            OPLUS_FEATURE_UFSPLUS \
            OPLUS_FEATURE_UFS_SHOW_LATENCY \
            OPLUS_FEATURE_PADL_STATISTICS \
            OPLUS_FEATURE_PROCESS_RECLAIM \
            OPLUS_FEATURE_MEMLEAK_DETECT; do
            printf '%s=%s\n' "$feature" "${!feature:-<unset>}" | tee -a "$ARTIFACT_DIR/oplus-feature-env.txt"
            test "${!feature:-}" = yes
          done

          cp "$KERNEL_DIR/OplusKernelEnvConfig.mk" "$STOCK_OUT_DIR/OplusKernelEnvConfig.mk"
          cp "$KERNEL_DIR/oplus_native_features.mk" "$STOCK_OUT_DIR/oplus_native_features.mk"

          MAKE_ARGS=(
            -C "$KERNEL_DIR"
            O="$GITHUB_WORKSPACE/$STOCK_OUT_DIR"
            ARCH=arm64
            SUBARCH=arm64
            CC="ccache clang-14"
            HOSTCC="ccache clang-14"
            HOSTCXX="ccache clang++-14"
            LD=aarch64-linux-gnu-ld
            AR=llvm-ar-14
            NM=llvm-nm-14
            OBJCOPY=aarch64-linux-gnu-objcopy
            OBJDUMP=llvm-objdump-14
            STRIP=llvm-strip-14
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            BRAND_SHOW_FLAG=oneplus
            KCFLAGS="-gdwarf-4 -Wno-error=strict-prototypes -Wno-error=unused-but-set-variable"
          )

          extract_stock_errors() {
            if [ -f "$ARTIFACT_DIR/build-stock.log" ]; then
              grep -nEi 'fatal error:|(^|[[:space:]])error:|undefined (reference|symbol)|relocation|dangerous relocation|make(\[[0-9]+\])?: \*\*\*' \
                "$ARTIFACT_DIR/build-stock.log" | head -n 240 > "$ARTIFACT_DIR/stock-first-errors.txt" || true
              tail -n 300 "$ARTIFACT_DIR/build-stock.log" > "$ARTIFACT_DIR/stock-log-tail.txt" || true
            fi
          }
          trap 'status=$?; extract_stock_errors; exit $status' EXIT

          make "${MAKE_ARGS[@]}" vendor/kona-perf_defconfig
          cp "$STOCK_OUT_DIR/.config" "$ARTIFACT_DIR/official-baseline.config"
          sha256sum "$ARTIFACT_DIR/official-baseline.config" | tee "$ARTIFACT_DIR/official-baseline.config.sha256"
          make -s "${MAKE_ARGS[@]}" kernelrelease | tee "$ARTIFACT_DIR/stock-kernelrelease.txt"

          make "${MAKE_ARGS[@]}" -j"$(nproc)" Image 2>&1 | tee "$ARTIFACT_DIR/build-stock.log"

          test -s "$STOCK_OUT_DIR/arch/arm64/boot/Image"
          cp "$STOCK_OUT_DIR/arch/arm64/boot/Image" "$ARTIFACT_DIR/Image-stock"
          sha256sum "$ARTIFACT_DIR/Image-stock" | tee "$ARTIFACT_DIR/SHA256SUMS-stock.txt"

      - name: Configure official baseline plus minimal KVM
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$OUT_DIR" "$ARTIFACT_DIR"

          export_oplus_features() {
            local key value
            while IFS='=' read -r key value; do
              [[ "$key" =~ ^[A-Z][A-Z0-9_]*$ ]] || continue
              export "$key=$value"
            done < "$KERNEL_DIR/oplus_native_features.mk"
          }
          export_oplus_features

          cp "$KERNEL_DIR/OplusKernelEnvConfig.mk" "$OUT_DIR/OplusKernelEnvConfig.mk"
          cp "$KERNEL_DIR/oplus_native_features.mk" "$OUT_DIR/oplus_native_features.mk"

          MAKE_ARGS=(
            -C "$KERNEL_DIR"
            O="$GITHUB_WORKSPACE/$OUT_DIR"
            ARCH=arm64
            SUBARCH=arm64
            CC="ccache clang-14"
            HOSTCC="ccache clang-14"
            HOSTCXX="ccache clang++-14"
            LD=aarch64-linux-gnu-ld
            AR=llvm-ar-14
            NM=llvm-nm-14
            OBJCOPY=aarch64-linux-gnu-objcopy
            OBJDUMP=llvm-objdump-14
            STRIP=llvm-strip-14
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            BRAND_SHOW_FLAG=oneplus
            KCFLAGS="-gdwarf-4 -Wno-error=strict-prototypes -Wno-error=unused-but-set-variable"
          )

          cp "$STOCK_OUT_DIR/.config" "$OUT_DIR/.config"
          cp "$OUT_DIR/.config" "$OUT_DIR/stock.config"

          "$KERNEL_DIR/scripts/config" --file "$OUT_DIR/.config" \
            -e VIRTUALIZATION \
            -e KVM

          make "${MAKE_ARGS[@]}" olddefconfig

          grep -qx 'CONFIG_VIRTUALIZATION=y' "$OUT_DIR/.config"
          grep -qx 'CONFIG_KVM=y' "$OUT_DIR/.config"

          "$KERNEL_DIR/scripts/diffconfig" "$OUT_DIR/stock.config" "$OUT_DIR/.config" \
            | tee "$ARTIFACT_DIR/config-diff.txt"
          make -s "${MAKE_ARGS[@]}" kernelrelease | tee "$ARTIFACT_DIR/kernelrelease.txt"
          cp "$OUT_DIR/.config" "$ARTIFACT_DIR/final-kvm.config"

      - name: Build KVM kernel Image
        shell: bash
        run: |
          set -euxo pipefail

          export_oplus_features() {
            local key value
            while IFS='=' read -r key value; do
              [[ "$key" =~ ^[A-Z][A-Z0-9_]*$ ]] || continue
              export "$key=$value"
            done < "$KERNEL_DIR/oplus_native_features.mk"
          }
          export_oplus_features

          MAKE_ARGS=(
            -C "$KERNEL_DIR"
            O="$GITHUB_WORKSPACE/$OUT_DIR"
            ARCH=arm64
            SUBARCH=arm64
            CC="ccache clang-14"
            HOSTCC="ccache clang-14"
            HOSTCXX="ccache clang++-14"
            LD=aarch64-linux-gnu-ld
            AR=llvm-ar-14
            NM=llvm-nm-14
            OBJCOPY=aarch64-linux-gnu-objcopy
            OBJDUMP=llvm-objdump-14
            STRIP=llvm-strip-14
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            BRAND_SHOW_FLAG=oneplus
            KCFLAGS="-gdwarf-4 -Wno-error=strict-prototypes -Wno-error=unused-but-set-variable"
          )

          extract_errors() {
            if [ -f "$ARTIFACT_DIR/build-kernel.log" ]; then
              grep -nEi 'fatal error:|(^|[[:space:]])error:|undefined (reference|symbol)|relocation|dangerous relocation|make(\[[0-9]+\])?: \*\*\*' \
                "$ARTIFACT_DIR/build-kernel.log" | head -n 240 > "$ARTIFACT_DIR/first-errors.txt" || true
              tail -n 300 "$ARTIFACT_DIR/build-kernel.log" > "$ARTIFACT_DIR/kvm-log-tail.txt" || true
            fi
          }
          trap 'status=$?; extract_errors; exit $status' EXIT

          make "${MAKE_ARGS[@]}" -j"$(nproc)" Image 2>&1 | tee "$ARTIFACT_DIR/build-kernel.log"

          test -s "$OUT_DIR/arch/arm64/boot/Image"
          cp "$OUT_DIR/arch/arm64/boot/Image" "$ARTIFACT_DIR/Image"
          [ ! -f "$OUT_DIR/System.map" ] || cp "$OUT_DIR/System.map" "$ARTIFACT_DIR/System.map"
          [ ! -f "$OUT_DIR/Module.symvers" ] || cp "$OUT_DIR/Module.symvers" "$ARTIFACT_DIR/Module.symvers"

          file "$ARTIFACT_DIR/Image"
          sha256sum "$ARTIFACT_DIR/Image" | tee "$ARTIFACT_DIR/SHA256SUMS.txt"
          ccache --show-stats || true

      - name: Upload kernel artifact and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: oneplus8-IN2010-13.1.0.190-official-kvm-minimal
          path: artifact/
          if-no-files-found: warn
          retention-days: 14
