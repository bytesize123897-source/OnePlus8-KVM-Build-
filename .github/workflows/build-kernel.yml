name: Build OnePlus 8 KVM Minimal Kernel

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-kernel.yml'
      - 'configs/**'
  workflow_dispatch:

concurrency:
  group: oneplus8-kvm-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      OFFICIAL_KERNEL_SHA: 1d2678a3548f4825447f17b25a5cc1754c4cd1ae
      OFFICIAL_MODULES_SHA: 01fb3921e0f57c338c95f9bcbe1a9938821c7e6d
      KERNEL_DIR: kernel/msm-4.19
      MODULES_DIR: official-modules
      OUT_DIR: out
      ARTIFACT_DIR: artifact
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: 'true'
      CCACHE_MAXSIZE: 5G
      CCACHE_COMPILERCHECK: content

    steps:
      - name: Checkout build controls
        uses: actions/checkout@v4
        with:
          path: control

      - name: Checkout official OnePlus kernel
        uses: actions/checkout@v4
        with:
          repository: OnePlusOSS/android_kernel_oneplus_sm8250
          ref: ${{ env.OFFICIAL_KERNEL_SHA }}
          path: ${{ env.KERNEL_DIR }}
          fetch-depth: 1

      - name: Checkout official OnePlus modules and device tree
        uses: actions/checkout@v4
        with:
          repository: OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm8250
          ref: ${{ env.OFFICIAL_MODULES_SHA }}
          path: ${{ env.MODULES_DIR }}
          fetch-depth: 1

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            ccache rsync python3 git make \
            clang-14 lld-14 llvm-14 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          mkdir -p "$CCACHE_DIR"
          ccache --set-config=max_size="$CCACHE_MAXSIZE"
          ccache --set-config=compression=true
          ccache --set-config=compiler_check=content
          ccache --zero-stats
          clang-14 --version | head -n 1
          ld.lld-14 --version | head -n 1
          aarch64-linux-gnu-gcc --version | head -n 1

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: oneplus8-kvm-1d2678a3548f-01fb3921e0f5-clang14-${{ hashFiles('control/configs/kvm-minimal.config') }}
          restore-keys: |
            oneplus8-kvm-1d2678a3548f-01fb3921e0f5-clang14-

      - name: Assemble official OnePlus source tree
        shell: bash
        run: |
          set -euxo pipefail
          test -d "$MODULES_DIR/kernel/msm-4.19"
          rsync -a "$MODULES_DIR/kernel/msm-4.19/" "$KERNEL_DIR/"

          rm -rf vendor
          ln -s "$GITHUB_WORKSPACE/$MODULES_DIR/vendor" vendor

          test -f "$KERNEL_DIR/arch/arm64/configs/vendor/kona-perf_defconfig"
          test -d vendor

          test "$(git -C "$KERNEL_DIR" rev-parse HEAD)" = "$OFFICIAL_KERNEL_SHA"
          test "$(git -C "$MODULES_DIR" rev-parse HEAD)" = "$OFFICIAL_MODULES_SHA"

          if grep -RniE 'daxiaamu|resukisu|kernelsu' "$KERNEL_DIR/Makefile" "$KERNEL_DIR/arch/arm64/configs/vendor/kona-perf_defconfig"; then
            echo 'Unexpected third-party branding/config found in official baseline.' >&2
            exit 1
          fi

      - name: Configure official baseline plus minimal KVM
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$OUT_DIR" "$ARTIFACT_DIR"

          MAKE_ARGS=(
            -C "$KERNEL_DIR"
            O="$GITHUB_WORKSPACE/$OUT_DIR"
            ARCH=arm64
            SUBARCH=arm64
            CC="ccache clang-14"
            HOSTCC="ccache clang-14"
            HOSTCXX="ccache clang++-14"
            LD=ld.lld-14
            AR=llvm-ar-14
            NM=llvm-nm-14
            OBJCOPY=llvm-objcopy-14
            OBJDUMP=llvm-objdump-14
            STRIP=llvm-strip-14
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            BRAND_SHOW_FLAG=oneplus
          )

          make "${MAKE_ARGS[@]}" vendor/kona-perf_defconfig
          cp "$OUT_DIR/.config" "$OUT_DIR/stock.config"

          "$KERNEL_DIR/scripts/config" --file "$OUT_DIR/.config" \
            -e VIRTUALIZATION \
            -e KVM

          make "${MAKE_ARGS[@]}" olddefconfig

          grep -qx 'CONFIG_LOCALVERSION="-perf"' "$OUT_DIR/.config"
          grep -qx '# CONFIG_LOCALVERSION_AUTO is not set' "$OUT_DIR/.config"
          grep -qx 'CONFIG_VIRTUALIZATION=y' "$OUT_DIR/.config"
          grep -qx 'CONFIG_KVM=y' "$OUT_DIR/.config"

          if grep -qiE 'daxiaamu|resukisu|kernelsu' "$OUT_DIR/.config"; then
            echo 'Unexpected third-party kernel configuration detected.' >&2
            exit 1
          fi

          "$KERNEL_DIR/scripts/diffconfig" "$OUT_DIR/stock.config" "$OUT_DIR/.config" | tee "$ARTIFACT_DIR/config-diff.txt"
          make -s "${MAKE_ARGS[@]}" kernelrelease | tee "$ARTIFACT_DIR/kernelrelease.txt"

          cp "$OUT_DIR/stock.config" "$ARTIFACT_DIR/official-baseline.config"
          cp "$OUT_DIR/.config" "$ARTIFACT_DIR/final-kvm.config"

      - name: Build kernel Image
        shell: bash
        run: |
          set -euxo pipefail

          MAKE_ARGS=(
            -C "$KERNEL_DIR"
            O="$GITHUB_WORKSPACE/$OUT_DIR"
            ARCH=arm64
            SUBARCH=arm64
            CC="ccache clang-14"
            HOSTCC="ccache clang-14"
            HOSTCXX="ccache clang++-14"
            LD=ld.lld-14
            AR=llvm-ar-14
            NM=llvm-nm-14
            OBJCOPY=llvm-objcopy-14
            OBJDUMP=llvm-objdump-14
            STRIP=llvm-strip-14
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            BRAND_SHOW_FLAG=oneplus
          )

          make "${MAKE_ARGS[@]}" -j"$(nproc)" Image
          test -s "$OUT_DIR/arch/arm64/boot/Image"
          cp "$OUT_DIR/arch/arm64/boot/Image" "$ARTIFACT_DIR/Image"

          [ ! -f "$OUT_DIR/System.map" ] || cp "$OUT_DIR/System.map" "$ARTIFACT_DIR/System.map"
          [ ! -f "$OUT_DIR/Module.symvers" ] || cp "$OUT_DIR/Module.symvers" "$ARTIFACT_DIR/Module.symvers"

          file "$ARTIFACT_DIR/Image"
          sha256sum "$ARTIFACT_DIR/Image" | tee "$ARTIFACT_DIR/SHA256SUMS.txt"
          ccache --show-stats || true

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: oneplus8-IN2010-13.1.0.190-official-kvm-minimal
          path: artifact/
          if-no-files-found: error
          retention-days: 14
