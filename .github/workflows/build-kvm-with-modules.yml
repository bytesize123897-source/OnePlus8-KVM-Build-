name: Build OnePlus 8 KVM kernel with matching modules

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-kvm-with-modules.yml'
      - 'configs/**'
      - 'patches/**'

concurrency:
  group: oneplus8-kvm-modules-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-kvm-modules:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      OFFICIAL_KERNEL_SHA: 1d2678a3548f4825447f17b25a5cc1754c4cd1ae
      OFFICIAL_MODULES_SHA: 01fb3921e0f57c338c95f9bcbe1a9938821c7e6d
      VERIFIED_STOCK_CONFIG_SHA256: ccb61daefc1d8e0f6de80eb4c4270173cabb1f1f9187e2749411e280d9ea7d6e
      KERNEL_DIR: kernel/msm-4.19
      MODULES_DIR: official-modules
      OUT_DIR: out
      MODULES_STAGING_DIR: modules-staging
      ARTIFACT_DIR: artifact
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: 'true'
      CCACHE_MAXSIZE: 5G
      CCACHE_COMPILERCHECK: content

    steps:
      - name: Checkout build controls
        uses: actions/checkout@v4
        with:
          path: control

      - name: Checkout pinned official kernel
        uses: actions/checkout@v4
        with:
          repository: OnePlusOSS/android_kernel_oneplus_sm8250
          ref: ${{ env.OFFICIAL_KERNEL_SHA }}
          path: ${{ env.KERNEL_DIR }}
          fetch-depth: 1

      - name: Checkout pinned modules and device tree
        uses: actions/checkout@v4
        with:
          repository: OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm8250
          ref: ${{ env.OFFICIAL_MODULES_SHA }}
          path: ${{ env.MODULES_DIR }}
          fetch-depth: 1

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev kmod \
            ccache rsync python3 git make clang-14 llvm-14 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

          mkdir -p "$CCACHE_DIR"
          ccache --set-config=max_size="$CCACHE_MAXSIZE"
          ccache --set-config=compression=true
          ccache --set-config=compiler_check=content
          ccache --zero-stats

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: oneplus8-kvm-modules-clang14-gnu-ld-${{ hashFiles('control/configs/kvm-minimal.config', 'control/patches/sm8250-link-compat.patch') }}
          restore-keys: |
            oneplus8-kvm-modules-clang14-gnu-ld-
            oneplus8-fast-kvm-clang14-gnu-ld-
            oneplus8-kvm-sm8250-linkfix-

      - name: Assemble verified OnePlus source tree
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$ARTIFACT_DIR"

          test "$(git -C "$KERNEL_DIR" rev-parse HEAD)" = "$OFFICIAL_KERNEL_SHA"
          test "$(git -C "$MODULES_DIR" rev-parse HEAD)" = "$OFFICIAL_MODULES_SHA"
          test -d "$MODULES_DIR/kernel/msm-4.19"

          rsync -a "$MODULES_DIR/kernel/msm-4.19/" "$KERNEL_DIR/"
          rm -rf vendor
          ln -s "$GITHUB_WORKSPACE/$MODULES_DIR/vendor" vendor

          test -d vendor/oplus/kernel/oplus_performance/sched_assist
          test -d vendor/qcom/opensource/audio-kernel
          test -d vendor/qcom/opensource/data-kernel
          test -d vendor/qcom/opensource/wlan

          PATCH="$GITHUB_WORKSPACE/control/patches/sm8250-link-compat.patch"
          git -C "$KERNEL_DIR" apply --check "$PATCH"
          git -C "$KERNEL_DIR" apply "$PATCH"

      - name: Configure verified stock baseline plus KVM
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$OUT_DIR" "$ARTIFACT_DIR"

          export_oplus_features() {
            local key value
            while IFS='=' read -r key value; do
              [[ "$key" =~ ^[A-Z][A-Z0-9_]*$ ]] || continue
              export "$key=$value"
            done < "$KERNEL_DIR/oplus_native_features.mk"
          }
          export_oplus_features

          cp "$KERNEL_DIR/OplusKernelEnvConfig.mk" "$OUT_DIR/OplusKernelEnvConfig.mk"
          cp "$KERNEL_DIR/oplus_native_features.mk" "$OUT_DIR/oplus_native_features.mk"

          MAKE_ARGS=(
            -C "$KERNEL_DIR"
            O="$GITHUB_WORKSPACE/$OUT_DIR"
            ARCH=arm64
            SUBARCH=arm64
            CC="ccache clang-14"
            HOSTCC="ccache clang-14"
            HOSTCXX="ccache clang++-14"
            LD=aarch64-linux-gnu-ld
            AR=llvm-ar-14
            NM=llvm-nm-14
            OBJCOPY=aarch64-linux-gnu-objcopy
            OBJDUMP=llvm-objdump-14
            STRIP=llvm-strip-14
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            BRAND_SHOW_FLAG=oneplus
            KCFLAGS="-gdwarf-4 -Wno-error=strict-prototypes -Wno-error=unused-but-set-variable"
          )

          make "${MAKE_ARGS[@]}" vendor/kona-perf_defconfig
          echo "$VERIFIED_STOCK_CONFIG_SHA256  $OUT_DIR/.config" | sha256sum -c -
          cp "$OUT_DIR/.config" "$OUT_DIR/stock.config"

          "$KERNEL_DIR/scripts/config" --file "$OUT_DIR/.config" \
            -e VIRTUALIZATION \
            -e KVM
          make "${MAKE_ARGS[@]}" olddefconfig

          grep -qx 'CONFIG_VIRTUALIZATION=y' "$OUT_DIR/.config"
          grep -qx 'CONFIG_KVM=y' "$OUT_DIR/.config"
          grep -qx 'CONFIG_KVM_ARM_HOST=y' "$OUT_DIR/.config"

          "$KERNEL_DIR/scripts/diffconfig" "$OUT_DIR/stock.config" "$OUT_DIR/.config" \
            | tee "$ARTIFACT_DIR/config-diff.txt"
          make -s "${MAKE_ARGS[@]}" kernelrelease | tee "$ARTIFACT_DIR/kernelrelease.txt"
          cp "$OUT_DIR/.config" "$ARTIFACT_DIR/final-kvm.config"

      - name: Build KVM Image and all configured modules together
        shell: bash
        run: |
          set -euxo pipefail

          export_oplus_features() {
            local key value
            while IFS='=' read -r key value; do
              [[ "$key" =~ ^[A-Z][A-Z0-9_]*$ ]] || continue
              export "$key=$value"
            done < "$KERNEL_DIR/oplus_native_features.mk"
          }
          export_oplus_features

          MAKE_ARGS=(
            -C "$KERNEL_DIR"
            O="$GITHUB_WORKSPACE/$OUT_DIR"
            ARCH=arm64
            SUBARCH=arm64
            CC="ccache clang-14"
            HOSTCC="ccache clang-14"
            HOSTCXX="ccache clang++-14"
            LD=aarch64-linux-gnu-ld
            AR=llvm-ar-14
            NM=llvm-nm-14
            OBJCOPY=aarch64-linux-gnu-objcopy
            OBJDUMP=llvm-objdump-14
            STRIP=llvm-strip-14
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            BRAND_SHOW_FLAG=oneplus
            KCFLAGS="-gdwarf-4 -Wno-error=strict-prototypes -Wno-error=unused-but-set-variable"
          )

          set +e
          make "${MAKE_ARGS[@]}" -j"$(nproc)" Image modules 2>&1 | tee "$ARTIFACT_DIR/build-kvm-modules.log"
          build_status=${PIPESTATUS[0]}
          set -e

          find "$OUT_DIR" -type f -name '*.ko' -printf '%P\n' | sort \
            | tee "$ARTIFACT_DIR/modules-built-paths.txt"
          wc -l < "$ARTIFACT_DIR/modules-built-paths.txt" \
            | tee "$ARTIFACT_DIR/modules-built-count.txt"

          if [ "$build_status" -ne 0 ]; then
            grep -nEi 'fatal error:|(^|[[:space:]])error:|undefined (reference|symbol)|relocation|dangerous relocation|make(\[[0-9]+\])?: \*\*\*' \
              "$ARTIFACT_DIR/build-kvm-modules.log" | head -n 300 \
              > "$ARTIFACT_DIR/first-errors.txt" || true
            exit "$build_status"
          fi

          test -s "$OUT_DIR/arch/arm64/boot/Image"
          cp "$OUT_DIR/arch/arm64/boot/Image" "$ARTIFACT_DIR/Image"
          cp "$OUT_DIR/Module.symvers" "$ARTIFACT_DIR/Module.symvers"
          [ ! -f "$OUT_DIR/System.map" ] || cp "$OUT_DIR/System.map" "$ARTIFACT_DIR/System.map"
          sha256sum "$ARTIFACT_DIR/Image" | tee "$ARTIFACT_DIR/Image.sha256"

      - name: Install and inventory matching modules
        shell: bash
        run: |
          set -euxo pipefail

          export_oplus_features() {
            local key value
            while IFS='=' read -r key value; do
              [[ "$key" =~ ^[A-Z][A-Z0-9_]*$ ]] || continue
              export "$key=$value"
            done < "$KERNEL_DIR/oplus_native_features.mk"
          }
          export_oplus_features

          MAKE_ARGS=(
            -C "$KERNEL_DIR"
            O="$GITHUB_WORKSPACE/$OUT_DIR"
            ARCH=arm64
            SUBARCH=arm64
            CC="ccache clang-14"
            HOSTCC="ccache clang-14"
            HOSTCXX="ccache clang++-14"
            LD=aarch64-linux-gnu-ld
            AR=llvm-ar-14
            NM=llvm-nm-14
            OBJCOPY=aarch64-linux-gnu-objcopy
            OBJDUMP=llvm-objdump-14
            STRIP=llvm-strip-14
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            BRAND_SHOW_FLAG=oneplus
            KCFLAGS="-gdwarf-4 -Wno-error=strict-prototypes -Wno-error=unused-but-set-variable"
          )

          rm -rf "$MODULES_STAGING_DIR"
          mkdir -p "$MODULES_STAGING_DIR" "$ARTIFACT_DIR/modules"

          make "${MAKE_ARGS[@]}" \
            INSTALL_MOD_PATH="$GITHUB_WORKSPACE/$MODULES_STAGING_DIR" \
            INSTALL_MOD_STRIP=1 \
            modules_install 2>&1 | tee "$ARTIFACT_DIR/modules-install.log"

          mapfile -t MODULES < <(find "$MODULES_STAGING_DIR" -type f -name '*.ko' | sort)
          printf '%s\n' "${#MODULES[@]}" | tee "$ARTIFACT_DIR/modules-installed-count.txt"

          : > "$ARTIFACT_DIR/modules-installed-paths.txt"
          : > "$ARTIFACT_DIR/modules-basenames.txt"
          : > "$ARTIFACT_DIR/modules-modinfo.tsv"
          printf 'module\tvermagic\tsigner\tsig_key\tsig_hashalgo\n' >> "$ARTIFACT_DIR/modules-modinfo.tsv"

          for module in "${MODULES[@]}"; do
            rel="${module#${MODULES_STAGING_DIR}/}"
            echo "$rel" >> "$ARTIFACT_DIR/modules-installed-paths.txt"
            basename "$module" >> "$ARTIFACT_DIR/modules-basenames.txt"

            vermagic="$(modinfo -F vermagic "$module" 2>/dev/null || true)"
            signer="$(modinfo -F signer "$module" 2>/dev/null || true)"
            sig_key="$(modinfo -F sig_key "$module" 2>/dev/null || true)"
            sig_hashalgo="$(modinfo -F sig_hashalgo "$module" 2>/dev/null || true)"
            printf '%s\t%s\t%s\t%s\t%s\n' "$(basename "$module")" "$vermagic" "$signer" "$sig_key" "$sig_hashalgo" \
              >> "$ARTIFACT_DIR/modules-modinfo.tsv"

            cp -p "$module" "$ARTIFACT_DIR/modules/$(basename "$module")"
          done

          sort -u "$ARTIFACT_DIR/modules-basenames.txt" -o "$ARTIFACT_DIR/modules-basenames.txt"
          find "$ARTIFACT_DIR/modules" -type f -name '*.ko' -print0 | sort -z | xargs -0 -r sha256sum \
            > "$ARTIFACT_DIR/modules-SHA256SUMS.txt"

          if [ -f "$OUT_DIR/certs/signing_key.x509" ]; then
            cp "$OUT_DIR/certs/signing_key.x509" "$ARTIFACT_DIR/signing_key.x509"
            openssl x509 -in "$OUT_DIR/certs/signing_key.x509" -inform DER -noout -subject -issuer -fingerprint -sha256 \
              > "$ARTIFACT_DIR/signing-certificate.txt" 2>/dev/null || \
            openssl x509 -in "$OUT_DIR/certs/signing_key.x509" -noout -subject -issuer -fingerprint -sha256 \
              > "$ARTIFACT_DIR/signing-certificate.txt" || true
          fi

          printf 'Built .ko count: ' > "$ARTIFACT_DIR/MODULE_REPORT.txt"
          cat "$ARTIFACT_DIR/modules-built-count.txt" >> "$ARTIFACT_DIR/MODULE_REPORT.txt"
          printf 'Installed .ko count: ' >> "$ARTIFACT_DIR/MODULE_REPORT.txt"
          cat "$ARTIFACT_DIR/modules-installed-count.txt" >> "$ARTIFACT_DIR/MODULE_REPORT.txt"
          printf 'Kernel release: ' >> "$ARTIFACT_DIR/MODULE_REPORT.txt"
          cat "$ARTIFACT_DIR/kernelrelease.txt" >> "$ARTIFACT_DIR/MODULE_REPORT.txt"

          ccache --show-stats || true

      - name: Upload KVM kernel and module inventory
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: oneplus8-IN2010-KVM-with-modules
          path: artifact/
          if-no-files-found: warn
          retention-days: 14
