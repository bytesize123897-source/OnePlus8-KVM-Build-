name: Compare OnePlus 8 stock vs KVM module CRCs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compare-module-crc.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  compare:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      OFFICIAL_KERNEL_SHA: 1d2678a3548f4825447f17b25a5cc1754c4cd1ae
      OFFICIAL_MODULES_SHA: 01fb3921e0f57c338c95f9bcbe1a9938821c7e6d
      VERIFIED_STOCK_CONFIG_SHA256: ccb61daefc1d8e0f6de80eb4c4270173cabb1f1f9187e2749411e280d9ea7d6e
      KVM_ARTIFACT_ID: '12723510313'
      KERNEL_DIR: kernel/msm-4.19
      MODULES_DIR: official-modules
      OUT_DIR: out-stock
      ARTIFACT_DIR: artifact
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 5G

    steps:
      - name: Checkout controls
        uses: actions/checkout@v4
        with:
          path: control

      - name: Checkout official kernel
        uses: actions/checkout@v4
        with:
          repository: OnePlusOSS/android_kernel_oneplus_sm8250
          ref: ${{ env.OFFICIAL_KERNEL_SHA }}
          path: ${{ env.KERNEL_DIR }}
          fetch-depth: 1

      - name: Checkout official modules and device tree
        uses: actions/checkout@v4
        with:
          repository: OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm8250
          ref: ${{ env.OFFICIAL_MODULES_SHA }}
          path: ${{ env.MODULES_DIR }}
          fetch-depth: 1

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev ccache rsync python3 git make \
            clang-14 llvm-14 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi curl unzip
          mkdir -p "$CCACHE_DIR" "$ARTIFACT_DIR"
          ccache --set-config=max_size="$CCACHE_MAXSIZE"
          ccache --set-config=compression=true
          ccache --set-config=compiler_check=content
          ccache --zero-stats

      - name: Restore stock compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: oneplus8-stock-crc-${{ env.OFFICIAL_KERNEL_SHA }}-${{ env.OFFICIAL_MODULES_SHA }}
          restore-keys: |
            oneplus8-kvm-1d2678a3548f-01fb3921e0f5-clang14-gnu-ld-
            oneplus8-fast-kvm-clang14-gnu-ld-
            oneplus8-kvm-diag-bypass-

      - name: Assemble verified source baseline
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git -C "$KERNEL_DIR" rev-parse HEAD)" = "$OFFICIAL_KERNEL_SHA"
          test "$(git -C "$MODULES_DIR" rev-parse HEAD)" = "$OFFICIAL_MODULES_SHA"
          rsync -a "$MODULES_DIR/kernel/msm-4.19/" "$KERNEL_DIR/"
          rm -rf vendor
          ln -s "$GITHUB_WORKSPACE/$MODULES_DIR/vendor" vendor
          git -C "$KERNEL_DIR" apply --check "$GITHUB_WORKSPACE/control/patches/sm8250-link-compat.patch"
          git -C "$KERNEL_DIR" apply "$GITHUB_WORKSPACE/control/patches/sm8250-link-compat.patch"

      - name: Build verified stock Image and Module.symvers
        shell: bash
        run: |
          set -euxo pipefail
          export_oplus_features() {
            local key value
            while IFS='=' read -r key value; do
              [[ "$key" =~ ^[A-Z][A-Z0-9_]*$ ]] || continue
              export "$key=$value"
            done < "$KERNEL_DIR/oplus_native_features.mk"
          }
          export_oplus_features
          mkdir -p "$OUT_DIR"
          cp "$KERNEL_DIR/OplusKernelEnvConfig.mk" "$OUT_DIR/OplusKernelEnvConfig.mk"
          cp "$KERNEL_DIR/oplus_native_features.mk" "$OUT_DIR/oplus_native_features.mk"
          MAKE_ARGS=(
            -C "$KERNEL_DIR" O="$GITHUB_WORKSPACE/$OUT_DIR" ARCH=arm64 SUBARCH=arm64
            CC="ccache clang-14" HOSTCC="ccache clang-14" HOSTCXX="ccache clang++-14"
            LD=aarch64-linux-gnu-ld AR=llvm-ar-14 NM=llvm-nm-14
            OBJCOPY=aarch64-linux-gnu-objcopy OBJDUMP=llvm-objdump-14 STRIP=llvm-strip-14
            CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- BRAND_SHOW_FLAG=oneplus
            KCFLAGS="-gdwarf-4 -Wno-error=strict-prototypes -Wno-error=unused-but-set-variable"
          )
          make "${MAKE_ARGS[@]}" vendor/kona-perf_defconfig
          echo "$VERIFIED_STOCK_CONFIG_SHA256  $OUT_DIR/.config" | sha256sum -c -
          make "${MAKE_ARGS[@]}" -j"$(nproc)" Image 2>&1 | tee "$ARTIFACT_DIR/build-stock.log"
          test -s "$OUT_DIR/Module.symvers"
          cp "$OUT_DIR/Module.symvers" "$ARTIFACT_DIR/Module.symvers-stock"
          cp "$OUT_DIR/.config" "$ARTIFACT_DIR/stock.config"
          ccache --show-stats || true

      - name: Download successful KVM Module.symvers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$KVM_ARTIFACT_ID/zip" \
            -o kvm-artifact.zip
          unzip -p kvm-artifact.zip Module.symvers > "$ARTIFACT_DIR/Module.symvers-kvm"
          test -s "$ARTIFACT_DIR/Module.symvers-kvm"

      - name: Compare CRCs symbol by symbol
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              out = {}
              for line in Path(path).read_text(errors='replace').splitlines():
                  parts = line.split()
                  if len(parts) >= 3:
                      crc, sym, mod = parts[:3]
                      out[sym] = (crc, mod, line)
              return out

          stock = read('artifact/Module.symvers-stock')
          kvm = read('artifact/Module.symvers-kvm')
          common = sorted(set(stock) & set(kvm))
          changed = [s for s in common if stock[s][0] != kvm[s][0]]
          added = sorted(set(kvm) - set(stock))
          removed = sorted(set(stock) - set(kvm))

          lines = [
              f'stock_symbols={len(stock)}',
              f'kvm_symbols={len(kvm)}',
              f'common_symbols={len(common)}',
              f'changed_crc={len(changed)}',
              f'added_symbols={len(added)}',
              f'removed_symbols={len(removed)}',
              '',
              '[changed CRC]',
          ]
          for s in changed:
              lines.append(f'{s}\t{stock[s][0]} -> {kvm[s][0]}\tstock:{stock[s][1]}\tkvm:{kvm[s][1]}')
          lines += ['', '[added]', *added, '', '[removed]', *removed]
          Path('artifact/module-crc-diff.txt').write_text('\n'.join(lines) + '\n')
          print('\n'.join(lines[:20]))

          high_risk = [s for s in changed if any(k in s.lower() for k in (
              'task', 'sched', 'mm', 'vma', 'page', 'process', 'signal', 'binder', 'mutex', 'rwsem', 'rcu'
          ))]
          Path('artifact/high-risk-changed-symbols.txt').write_text('\n'.join(high_risk) + '\n')
          print(f'high_risk_changed={len(high_risk)}')
          PY

      - name: Upload comparison
        uses: actions/upload-artifact@v4
        with:
          name: oneplus8-stock-vs-kvm-module-crc
          path: artifact/
          if-no-files-found: error
          retention-days: 14
