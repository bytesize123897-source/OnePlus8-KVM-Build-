name: Build OnePlus 8 KVM stock-layout diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-kvm-stock-layout-diag.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      OFFICIAL_KERNEL_SHA: 1d2678a3548f4825447f17b25a5cc1754c4cd1ae
      OFFICIAL_MODULES_SHA: 01fb3921e0f57c338c95f9bcbe1a9938821c7e6d
      KERNEL_DIR: kernel/msm-4.19
      MODULES_DIR: official-modules
      OUT_DIR: out
      ARTIFACT_DIR: artifact
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 5G
      STOCK_CONFIG_URL: https://raw.githubusercontent.com/daxiaamu/ReSukiSU-OnePlus-Legacy/d3ef96ab6c90aaf0645b148bee392dfdf4f9b036/configs/stock/oneplus-8/coloros.config
      STOCK_CONFIG_SHA256: ae25610534f3da161c1cd07067c39add4112afb62ad7665824b2aaaaab3ee226
      STOCK_CERT_URL: https://raw.githubusercontent.com/daxiaamu/ReSukiSU-OnePlus-Legacy/d3ef96ab6c90aaf0645b148bee392dfdf4f9b036/compat/module-certificates/oneplus-8/coloros-0.pem
      STOCK_CERT_SHA256: 4394860b49e3d6ba66f95d58c2f86367a2d2db13479bb6b3e4351953ee3de715
      REFERENCE_URL: https://github.com/daxiaamu/ReSukiSU-OnePlus-Legacy/releases/download/v0.3.0/oneplus-8-coloros-IN2010_13.1.0.190-CN01-v0.3.0.zip
      REFERENCE_ZIP_SHA256: 76ff74b28a1eb5954d2c275a772642bd7e37891b765a6ade1d595e34f04be947
      REFERENCE_BOOT_SHA256: ce16155f0f1dfaa90da4c2508c8d219a8fdeeec35101669ea50d3979001a04d4
      STOCK_BOOT_SIZE: '100663296'
      MAGISK_URL: https://github.com/topjohnwu/Magisk/releases/download/v30.7/Magisk-v30.7.apk
      MAGISK_APK_SHA256: e0d32d2123532860f97123d927b1bb86c4e08e6fd8a48bfc6b5bee0afae9ebd5
      MAGISKBOOT_MEMBER: lib/x86_64/libmagiskboot.so
      OUTPUT_NAME: boot-IN2010-13.1.0.190-KVM-DIAG-STOCK-LAYOUT.img

    steps:
      - name: Checkout controls
        uses: actions/checkout@v4
        with:
          path: control

      - name: Checkout pinned official kernel
        uses: actions/checkout@v4
        with:
          repository: OnePlusOSS/android_kernel_oneplus_sm8250
          ref: ${{ env.OFFICIAL_KERNEL_SHA }}
          path: ${{ env.KERNEL_DIR }}
          fetch-depth: 1

      - name: Checkout pinned modules and device tree
        uses: actions/checkout@v4
        with:
          repository: OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm8250
          ref: ${{ env.OFFICIAL_MODULES_SHA }}
          path: ${{ env.MODULES_DIR }}
          fetch-depth: 1

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev ccache rsync python3 git make \
            clang-14 llvm-14 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi curl unzip openssl coreutils diffutils
          mkdir -p "$CCACHE_DIR" "$ARTIFACT_DIR"
          ccache --set-config=max_size="$CCACHE_MAXSIZE"
          ccache --set-config=compression=true
          ccache --set-config=compiler_check=content
          ccache --zero-stats

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: oneplus8-kvm-stock-layout-${{ hashFiles('control/patches/sm8250-link-compat.patch', 'control/patches/kvm-diag-bypass-arch-init.patch') }}
          restore-keys: |
            oneplus8-kvm-stock-trust-
            oneplus8-kvm-diag-bypass-
            oneplus8-fast-kvm-clang14-gnu-ld-

      - name: Assemble source and preserve stock core layouts
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git -C "$KERNEL_DIR" rev-parse HEAD)" = "$OFFICIAL_KERNEL_SHA"
          test "$(git -C "$MODULES_DIR" rev-parse HEAD)" = "$OFFICIAL_MODULES_SHA"
          rsync -a "$MODULES_DIR/kernel/msm-4.19/" "$KERNEL_DIR/"
          rm -rf vendor
          ln -s "$GITHUB_WORKSPACE/$MODULES_DIR/vendor" vendor
          git -C "$KERNEL_DIR" apply --check "$GITHUB_WORKSPACE/control/patches/sm8250-link-compat.patch"
          git -C "$KERNEL_DIR" apply "$GITHUB_WORKSPACE/control/patches/sm8250-link-compat.patch"
          git -C "$KERNEL_DIR" apply --check "$GITHUB_WORKSPACE/control/patches/kvm-diag-bypass-arch-init.patch"
          git -C "$KERNEL_DIR" apply "$GITHUB_WORKSPACE/control/patches/kvm-diag-bypass-arch-init.patch"

          curl -fL --retry 3 "$STOCK_CERT_URL" -o "$KERNEL_DIR/certs/stock-trusted.pem"
          echo "$STOCK_CERT_SHA256  $KERNEL_DIR/certs/stock-trusted.pem" | sha256sum -c -

          python3 - <<'PY'
          from pathlib import Path
          import re

          # 诊断目的：KVM 代码仍编译，但不允许它通过 Kconfig 改变
          # task_struct 和 mm_struct 的 stock 布局。
          kp = Path('kernel/msm-4.19/arch/arm64/kvm/Kconfig')
          s = kp.read_text()
          for line in ('\tselect MMU_NOTIFIER\n', '\tselect PREEMPT_NOTIFIERS\n'):
              if s.count(line) != 1:
                  raise SystemExit(f'Kconfig expected exactly one: {line!r}, got {s.count(line)}')
              s = s.replace(line, '', 1)
          kp.write_text(s)

          # KVM 在非 VHE 时会自动关闭 SVE；诊断版恢复 stock 的 SVE=y，
          # 只用于排除静态布局/配置副作用，不代表最终 KVM 设计。
          ap = Path('kernel/msm-4.19/arch/arm64/Kconfig')
          s = ap.read_text()
          old = '\tdepends on !KVM || ARM64_VHE\n'
          if s.count(old) != 1:
              raise SystemExit(f'ARM64_SVE dependency occurrence={s.count(old)}')
          ap.write_text(s.replace(old, '\tdepends on y\n', 1))

          # PREEMPT_NOTIFIERS=n 后，相关类型和 kvm_vcpu 字段都不存在。
          # 将 KVM 的 notifier glue 条件编译掉；本诊断版 HYP 入口本来就返回 -ENODEV，
          # 因而不会实际创建/运行 vCPU。
          p = Path('kernel/msm-4.19/virt/kvm/kvm_main.c')
          s = p.read_text()

          def one(old, new, name):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{name}: expected 1 occurrence, got {n}')
              s = s.replace(old, new, 1)

          one('static __read_mostly struct preempt_ops kvm_preempt_ops;\n',
              '#ifdef CONFIG_PREEMPT_NOTIFIERS\nstatic __read_mostly struct preempt_ops kvm_preempt_ops;\n#endif\n',
              'preempt ops declaration')

          one('\tpreempt_notifier_register(&vcpu->preempt_notifier);\n',
              '#ifdef CONFIG_PREEMPT_NOTIFIERS\n\tpreempt_notifier_register(&vcpu->preempt_notifier);\n#endif\n',
              'vcpu_load notifier register')

          one('\tpreempt_notifier_unregister(&vcpu->preempt_notifier);\n',
              '#ifdef CONFIG_PREEMPT_NOTIFIERS\n\tpreempt_notifier_unregister(&vcpu->preempt_notifier);\n#endif\n',
              'vcpu_put notifier unregister')

          one('\tpreempt_notifier_init(&vcpu->preempt_notifier, &kvm_preempt_ops);\n',
              '#ifdef CONFIG_PREEMPT_NOTIFIERS\n\tpreempt_notifier_init(&vcpu->preempt_notifier, &kvm_preempt_ops);\n#endif\n',
              'vcpu notifier init')

          start = s.find('static inline\nstruct kvm_vcpu *preempt_notifier_to_vcpu')
          end = s.find('\nint kvm_init(void *opaque, unsigned vcpu_size, unsigned vcpu_align,', start)
          if start < 0 or end < 0:
              raise SystemExit('could not locate KVM preempt callback block')
          block = s[start:end]
          s = s[:start] + '#ifdef CONFIG_PREEMPT_NOTIFIERS\n' + block + '#endif /* CONFIG_PREEMPT_NOTIFIERS */\n' + s[end:]

          one('\tkvm_preempt_ops.sched_in = kvm_sched_in;\n\tkvm_preempt_ops.sched_out = kvm_sched_out;\n',
              '#ifdef CONFIG_PREEMPT_NOTIFIERS\n\tkvm_preempt_ops.sched_in = kvm_sched_in;\n\tkvm_preempt_ops.sched_out = kvm_sched_out;\n#endif\n',
              'preempt callback assignment')

          p.write_text(s)
          PY

          grep -n -A30 'config KVM$' "$KERNEL_DIR/arch/arm64/kvm/Kconfig"
          grep -n -A5 -B2 '^config ARM64_SVE' "$KERNEL_DIR/arch/arm64/Kconfig"
          grep -n -A8 -B3 'KVM-DIAG: bypassing' "$KERNEL_DIR/virt/kvm/arm/arm.c"

      - name: Configure exact ColorOS stock base plus layout-safe KVM diagnostic
        shell: bash
        run: |
          set -euxo pipefail
          export_oplus_features() {
            local key value
            while IFS='=' read -r key value; do
              [[ "$key" =~ ^[A-Z][A-Z0-9_]*$ ]] || continue
              export "$key=$value"
            done < "$KERNEL_DIR/oplus_native_features.mk"
          }
          export_oplus_features
          mkdir -p "$OUT_DIR"
          cp "$KERNEL_DIR/OplusKernelEnvConfig.mk" "$OUT_DIR/OplusKernelEnvConfig.mk"
          cp "$KERNEL_DIR/oplus_native_features.mk" "$OUT_DIR/oplus_native_features.mk"
          curl -fL --retry 3 "$STOCK_CONFIG_URL" -o "$OUT_DIR/.config"
          echo "$STOCK_CONFIG_SHA256  $OUT_DIR/.config" | sha256sum -c -
          cp "$OUT_DIR/.config" "$OUT_DIR/stock.config"

          MAKE_ARGS=(
            -C "$KERNEL_DIR" O="$GITHUB_WORKSPACE/$OUT_DIR" ARCH=arm64 SUBARCH=arm64
            CC="ccache clang-14" HOSTCC="ccache clang-14" HOSTCXX="ccache clang++-14"
            LD=aarch64-linux-gnu-ld AR=llvm-ar-14 NM=llvm-nm-14
            OBJCOPY=aarch64-linux-gnu-objcopy OBJDUMP=llvm-objdump-14 STRIP=llvm-strip-14
            CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- BRAND_SHOW_FLAG=oneplus
            KCFLAGS="-gdwarf-4 -Wno-error=strict-prototypes -Wno-error=unused-but-set-variable"
          )

          "$KERNEL_DIR/scripts/config" --file "$OUT_DIR/.config" \
            -e VIRTUALIZATION -e KVM -e ARM64_SVE \
            -d PREEMPT_NOTIFIERS -d MMU_NOTIFIER \
            --set-str SYSTEM_TRUSTED_KEYS 'certs/stock-trusted.pem'
          make "${MAKE_ARGS[@]}" olddefconfig

          grep -qx 'CONFIG_KVM=y' "$OUT_DIR/.config"
          grep -qx 'CONFIG_VIRTUALIZATION=y' "$OUT_DIR/.config"
          grep -qx 'CONFIG_ARM64_SVE=y' "$OUT_DIR/.config"
          grep -qx '# CONFIG_PREEMPT_NOTIFIERS is not set' "$OUT_DIR/.config"
          grep -qx '# CONFIG_MMU_NOTIFIER is not set' "$OUT_DIR/.config"
          grep -qx 'CONFIG_MODULE_SIG_FORCE=y' "$OUT_DIR/.config"
          grep -qx 'CONFIG_MODVERSIONS=y' "$OUT_DIR/.config"
          grep -qx 'CONFIG_SYSTEM_TRUSTED_KEYS="certs/stock-trusted.pem"' "$OUT_DIR/.config"

          "$KERNEL_DIR/scripts/diffconfig" "$OUT_DIR/stock.config" "$OUT_DIR/.config" | tee "$ARTIFACT_DIR/config-diff.txt"
          cp "$OUT_DIR/.config" "$ARTIFACT_DIR/final.config"
          make -s "${MAKE_ARGS[@]}" kernelrelease | tee "$ARTIFACT_DIR/kernelrelease.txt"

      - name: Build stock-layout diagnostic Image
        shell: bash
        run: |
          set -euxo pipefail
          export_oplus_features() {
            local key value
            while IFS='=' read -r key value; do
              [[ "$key" =~ ^[A-Z][A-Z0-9_]*$ ]] || continue
              export "$key=$value"
            done < "$KERNEL_DIR/oplus_native_features.mk"
          }
          export_oplus_features
          MAKE_ARGS=(
            -C "$KERNEL_DIR" O="$GITHUB_WORKSPACE/$OUT_DIR" ARCH=arm64 SUBARCH=arm64
            CC="ccache clang-14" HOSTCC="ccache clang-14" HOSTCXX="ccache clang++-14"
            LD=aarch64-linux-gnu-ld AR=llvm-ar-14 NM=llvm-nm-14
            OBJCOPY=aarch64-linux-gnu-objcopy OBJDUMP=llvm-objdump-14 STRIP=llvm-strip-14
            CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- BRAND_SHOW_FLAG=oneplus
            KCFLAGS="-gdwarf-4 -Wno-error=strict-prototypes -Wno-error=unused-but-set-variable"
          )
          make "${MAKE_ARGS[@]}" -j"$(nproc)" Image 2>&1 | tee "$ARTIFACT_DIR/build.log"
          test -s "$OUT_DIR/arch/arm64/boot/Image"
          cp "$OUT_DIR/arch/arm64/boot/Image" "$ARTIFACT_DIR/Image"
          cp "$OUT_DIR/System.map" "$ARTIFACT_DIR/System.map"
          cp "$OUT_DIR/Module.symvers" "$ARTIFACT_DIR/Module.symvers"
          sha256sum "$ARTIFACT_DIR/Image" | tee "$ARTIFACT_DIR/IMAGE_SHA256.txt"
          ccache --show-stats || true

      - name: Package and verify diagnostic boot
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p package/reference package/work package/check "$ARTIFACT_DIR/boot"
          curl -fL --retry 3 "$REFERENCE_URL" -o package/reference.zip
          echo "$REFERENCE_ZIP_SHA256  package/reference.zip" | sha256sum -c -
          unzip -q package/reference.zip -d package/reference
          mapfile -t boots < <(find package/reference -type f -name 'boot*.img' -print | sort)
          test "${#boots[@]}" -eq 1
          cp "${boots[0]}" package/reference-boot.img
          echo "$REFERENCE_BOOT_SHA256  package/reference-boot.img" | sha256sum -c -
          test "$(stat -c %s package/reference-boot.img)" -eq "$STOCK_BOOT_SIZE"

          curl -fL --retry 3 "$MAGISK_URL" -o package/Magisk.apk
          echo "$MAGISK_APK_SHA256  package/Magisk.apk" | sha256sum -c -
          unzip -p package/Magisk.apk "$MAGISKBOOT_MEMBER" > package/magiskboot
          chmod +x package/magiskboot

          cp package/reference-boot.img package/work/base.img
          cp package/magiskboot package/work/magiskboot
          pushd package/work
          ./magiskboot unpack base.img
          test -s kernel
          cp ../../artifact/Image kernel
          ./magiskboot repack base.img candidate.img
          popd

          cp package/work/candidate.img "$ARTIFACT_DIR/boot/$OUTPUT_NAME"
          truncate -s "$STOCK_BOOT_SIZE" "$ARTIFACT_DIR/boot/$OUTPUT_NAME"
          cp "$ARTIFACT_DIR/boot/$OUTPUT_NAME" package/check/final.img
          cp package/magiskboot package/check/magiskboot
          pushd package/check
          ./magiskboot unpack final.img
          cmp -s kernel ../../artifact/Image
          popd

          sha256sum "$ARTIFACT_DIR/boot/$OUTPUT_NAME" | tee "$ARTIFACT_DIR/boot/SHA256SUMS.txt"
          printf '%s\n' \
            'Diagnostic only: KVM code is built, but HYP init is bypassed.' \
            'PREEMPT_NOTIFIERS and MMU_NOTIFIER remain disabled to preserve stock task_struct/mm_struct layout.' \
            'ARM64_SVE is restored and the original ColorOS module certificate is trusted.' \
            'This image is not expected to provide a functional /dev/kvm; it isolates vendor-module ABI/layout effects.' \
            > "$ARTIFACT_DIR/boot/README.txt"

      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: oneplus8-IN2010-KVM-DIAG-STOCK-LAYOUT
          path: artifact/
          if-no-files-found: error
          retention-days: 14
